name: example

# Manual only. In a private repo this needs a self-hosted runner and the repo-level
# RUNNER_BILLING_TOKEN secret. Option 2's router job is pinned to self-hosted, so it
# is for private repos only; in a public repo run that job on ubuntu-latest instead.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Option 1: reusable workflow
  route:
    uses: ProAgentStore/runner-router/.github/workflows/router.yml@v1
    with:
      self-hosted-labels: self-hosted,pags
      included-minutes: 3000
    secrets:
      billing-token: ${{ secrets.RUNNER_BILLING_TOKEN }}

  build:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    steps:
      - run: echo "Routed to ${{ needs.route.outputs.runner }}"

  # Option 2: composite action (private repos: this job must run on self-hosted)
  route-composite:
    runs-on: [self-hosted, pags]
    outputs:
      runner: ${{ steps.router.outputs.runner }}
    steps:
      - id: router
        uses: ProAgentStore/runner-router@v1
        with:
          self-hosted-labels: self-hosted,pags
          included-minutes: 3000
          billing-token: ${{ secrets.RUNNER_BILLING_TOKEN }}

  build-composite:
    needs: route-composite
    runs-on: ${{ fromJSON(needs.route-composite.outputs.runner) }}
    steps:
      - run: echo "Routed to ${{ needs.route-composite.outputs.runner }}"
