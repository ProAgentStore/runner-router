name: example

# Manual only: the router needs a self-hosted runner and a billing token,
# so this would queue forever on a repo that has neither.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Option 1: reusable workflow
  route:
    uses: serge-ivo/runner-router/.github/workflows/router.yml@v1
    with:
      self-hosted-labels: self-hosted,pags
      included-minutes: 3000
    secrets:
      billing-token: ${{ secrets.ORG_BILLING_TOKEN }}

  build:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runner) }}
    steps:
      - run: echo "Routed to ${{ needs.route.outputs.runner }}"

  # Option 2: composite action (this job must run on self-hosted)
  route-composite:
    runs-on: [self-hosted, pags]
    outputs:
      runner: ${{ steps.router.outputs.runner }}
    steps:
      - id: router
        uses: serge-ivo/runner-router@v1
        with:
          self-hosted-labels: self-hosted,pags
          included-minutes: 3000
          billing-token: ${{ secrets.ORG_BILLING_TOKEN }}

  build-composite:
    needs: route-composite
    runs-on: ${{ fromJSON(needs.route-composite.outputs.runner) }}
    steps:
      - run: echo "Routed to ${{ needs.route-composite.outputs.runner }}"
