name: publish-mode

# #3: checks each org's Actions billing once, centrally, and publishes mode.json, which
# private repos' routers read instead of holding a billing token. This repo is public,
# so the run itself uses free hosted minutes. mode.json is committed only when it
# changes (a mode flip, or the first run of a UTC day). The daily commit also keeps
# this schedule alive: GitHub disables schedules in public repos after 60 days with no
# repository activity.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mode
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check billing and publish mode.json
        env:
          BILLING_APP_ID: ${{ secrets.BILLING_APP_ID }}
          BILLING_APP_PRIVATE_KEY: ${{ secrets.BILLING_APP_PRIVATE_KEY }}
          ROUTER_INCLUDED_MINUTES: 2000
          ROUTER_SAFETY_MARGIN: 100
        run: |
          status=0
          bash scripts/publish-mode.sh || status=$?
          if [ -n "$(git status --porcelain -- mode.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mode.json
            git commit -q -m "mode.json: publish billing mode (refs #3)"
            git pull -q --rebase
            git push -q
          fi
          exit "$status"
