name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh tests/*.sh

  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/route_test.sh

  # This repo is public, so both entry points must route hosted end to end: the
  # router job itself lands on hosted and no billing check runs. The private-repo
  # billing and fail-safe paths are covered offline by tests/route_test.sh.
  reusable-selftest:
    uses: ./.github/workflows/router.yml

  composite-selftest:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: route
        uses: ./

  assert-public-hosted:
    needs: [reusable-selftest, composite-selftest]
    runs-on: ubuntu-latest
    steps:
      - name: On a public repo both entry points must route to GitHub-hosted
        env:
          REUSABLE: ${{ needs.reusable-selftest.outputs.runner }}
          COMPOSITE: ${{ needs.composite-selftest.outputs.runner }}
        run: |
          want='["ubuntu-latest"]'
          echo "reusable=$REUSABLE composite=$COMPOSITE"
          [ "$REUSABLE" = "$want" ] || { echo "reusable workflow did not route a public repo to hosted"; exit 1; }
          [ "$COMPOSITE" = "$want" ] || { echo "composite action did not route a public repo to hosted"; exit 1; }
