name: runner-router

# Reusable workflow: outputs `runner`, a JSON array to use with
#   runs-on: ${{ fromJSON(needs.<router-job>.outputs.runner) }}
# A public calling repo always gets hosted-label, and so does this router job: no
# self-hosted runner is ever requested and the billing token is never read.
# See README.md for required token scopes and the fail-safe behaviour.
on:
  workflow_call:
    inputs:
      org:
        description: Org whose Actions billing is checked. Empty = the calling repo's owner.
        type: string
        default: ''
      router-label:
        description: runs-on for the router job on private repos. Must be self-hosted, because hosted jobs are blocked once minutes run out. Public repos ignore it and use hosted-label.
        type: string
        default: self-hosted
      hosted-label:
        description: >-
          runs-on label for GitHub-hosted runners, e.g. ubuntu-24.04 to pin an exact image
          instead of ubuntu-latest. An unrecognized image falls back to ubuntu-latest. Left
          at its default, a .github/runner-router.json config file in the calling repo (see
          README) is consulted instead, so a repo does not have to touch every call site.
        type: string
        default: ubuntu-latest
      self-hosted-labels:
        description: Comma-separated labels for self-hosted runners.
        type: string
        default: self-hosted,pags
      included-minutes:
        description: Actions minutes included in the org's plan for the billing cycle.
        type: number
        default: 2000
      safety-margin-minutes:
        description: Switch to self-hosted this many minutes before the included total is reached.
        type: number
        default: 0
    secrets:
      billing-token:
        description: Token with org billing read access, from a repo-level secret on private repos (see README). Never read for public repos. Without it a private repo fails safe to self-hosted.
        required: false
    outputs:
      runner:
        description: JSON array for runs-on, e.g. ["ubuntu-latest"] or ["self-hosted","pags"].
        value: ${{ jobs.route.outputs.runner }}

jobs:
  route:
    # github.event.repository is the caller's. Only an explicit private == true
    # requests self-hosted; public, or visibility unknown, stays on hosted.
    runs-on: ${{ github.event.repository.private == true && inputs.router-label || inputs.hosted-label }}
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - name: Check out router script
        uses: actions/checkout@v4
        with:
          repository: ProAgentStore/runner-router
          ref: ${{ github.job_workflow_sha }}
          path: runner-router
          persist-credentials: false

      # #2: an optional .github/runner-router.json in the CALLING repo, read via the API
      # (no checkout of that repo needed) with the job's own ambient token — read-only,
      # same-repo, no extra secret. A missing file is normal, not an error.
      - id: config
        name: Read optional per-repo runner-router config
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          label=""
          if command -v curl >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
            status=$(curl -sS -o /tmp/runner-router-config.json -w '%{http_code}' --max-time 10 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/contents/.github/runner-router.json?ref=${{ github.sha }}")
            [ "$status" = 200 ] && label=$(jq -r '."hosted-label" // empty' /tmp/runner-router-config.json 2>/dev/null)
          fi
          echo "hosted-label=${label:-}" >> "$GITHUB_OUTPUT"
          exit 0

      - id: route
        name: Decide runs-on
        shell: bash
        env:
          ROUTER_ORG: ${{ inputs.org || github.repository_owner }}
          ROUTER_REPO_PRIVATE: ${{ github.event.repository.private == true }}
          ROUTER_BILLING_TOKEN: ${{ github.event.repository.private == true && secrets.billing-token || '' }}
          ROUTER_HOSTED_LABEL: ${{ inputs.hosted-label }}
          ROUTER_CONFIG_HOSTED_LABEL: ${{ steps.config.outputs.hosted-label }}
          ROUTER_SELF_HOSTED_LABELS: ${{ inputs.self-hosted-labels }}
          ROUTER_INCLUDED_MINUTES: ${{ inputs.included-minutes }}
          ROUTER_SAFETY_MARGIN: ${{ inputs.safety-margin-minutes }}
        run: bash runner-router/scripts/route.sh
